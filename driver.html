<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Car Set U - Driver</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      color: #222;
    }

    .header {
      background: #111827;
      color: white;
      padding: 18px;
      text-align: center;
    }

    .header h1 {
      margin: 0;
      font-size: 24px;
    }

    .header p {
      margin: 6px 0 0;
      font-size: 14px;
    }

    .container {
      max-width: 500px;
      margin: 20px auto;
      padding: 15px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 15px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.10);
    }

    .status {
      text-align: center;
      padding: 15px;
      border-radius: 12px;
      background: #eee;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .online {
      background: #d1fae5;
      color: #065f46;
    }

    .offline {
      background: #fee2e2;
      color: #991b1b;
    }

    label {
      display: block;
      margin-top: 12px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input,
    select {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      width: 100%;
      border: none;
      padding: 14px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      margin-top: 12px;
      cursor: pointer;
    }

    .green {
      background: #16a34a;
      color: white;
    }

    .red {
      background: #dc2626;
      color: white;
    }

    .blue {
      background: #2563eb;
      color: white;
    }

    .orange {
      background: #f97316;
      color: white;
    }

    .info {
      line-height: 1.8;
    }

    #message {
      text-align: center;
      margin-top: 12px;
      font-weight: bold;
    }

    /* BOOKING ALERT */

    #bookingAlert {
      display: none;
      background: #fff7ed;
      border: 4px solid #ef4444;
      animation: alertPulse 1s infinite;
    }

    #bookingAlert.active {
      display: block;
    }

    .booking-title {
      text-align: center;
      font-size: 25px;
      font-weight: bold;
      color: #dc2626;
      margin-bottom: 15px;
    }

    .booking-sound {
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      color: #991b1b;
      margin-bottom: 12px;
    }

    .booking-details {
      background: white;
      border-radius: 12px;
      padding: 15px;
      line-height: 1.9;
      border: 1px solid #fecaca;
    }

    @keyframes alertPulse {
      0% {
        box-shadow: 0 0 0 0 rgba(239,68,68,0.7);
      }

      70% {
        box-shadow: 0 0 0 12px rgba(239,68,68,0);
      }

      100% {
        box-shadow: 0 0 0 0 rgba(239,68,68,0);
      }
    }

    .alert-button {
      background: #dc2626;
      color: white;
    }

    .small-note {
      text-align: center;
      font-size: 13px;
      color: #666;
      margin-top: 8px;
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>🚕 Car Set U</h1>
    <p>Driver Panel</p>
  </div>

  <div class="container">

    <!-- BOOKING ALERT -->

    <div id="bookingAlert" class="card">

      <div class="booking-title">
        🚨 NEW BOOKING ALERT 🚨
      </div>

      <div class="booking-sound">
        🔊 BOOKING RECEIVED — PLEASE CHECK
      </div>

      <div id="bookingDetails" class="booking-details">
        New booking received.
      </div>

      <button
        class="alert-button"
        onclick="stopBookingAlert()">
        STOP ALERT
      </button>

      <div class="small-note">
        New booking आने पर alert sound और vibration चलेगा।
      </div>

    </div>


    <!-- DRIVER CONTROL -->

    <div class="card">

      <div id="statusBox" class="status offline">
        DRIVER OFFLINE
      </div>

      <label>Driver ID</label>
      <input id="driverId" value="DRIVER001">

      <label>Driver Name</label>
      <input id="driverName" value="Driver 001">

      <label>Duty Status</label>

      <select id="dutyStatus">
        <option value="OFF">OFF</option>
        <option value="ON">ON</option>
      </select>

      <button
        class="green"
        onclick="goOnline()">
        GO ONLINE
      </button>

      <button
        class="red"
        onclick="goOffline()">
        GO OFFLINE
      </button>

      <button
        class="blue"
        onclick="getLocation()">
        UPDATE MY LOCATION
      </button>

      <div id="message"></div>

    </div>


    <!-- DRIVER INFORMATION -->

    <div class="card info">

      <h3>Driver Information</h3>

      <div>
        <b>Driver:</b>
        <span id="showName">
          Driver 001
        </span>
      </div>

      <div>
        <b>Duty:</b>
        <span id="showDuty">
          OFF
        </span>
      </div>

      <div>
        <b>Latitude:</b>
        <span id="showLat">
          -
        </span>
      </div>

      <div>
        <b>Longitude:</b>
        <span id="showLng">
          -
        </span>
      </div>

    </div>

  </div>


<script>

/* =========================================================
   FIREBASE
========================================================= */

const DATABASE_URL =
"https://car-set-u-default-rtdb.asia-southeast1.firebasedatabase.app";


/*
   IMPORTANT:

   आपकी customer/booking system अगर bookings को
   /bookings में save करती है तो इसे ऐसे ही रहने दें.

   अगर आपकी booking किसी दूसरे Firebase path में आती है,
   तो बाद में सिर्फ यही line बदलेंगे.
*/

const BOOKINGS_PATH = "/bookings";


/* =========================================================
   DRIVER PATH
========================================================= */

function driverPath() {

  const id =
    document
      .getElementById("driverId")
      .value
      .trim();

  return DATABASE_URL +
    "/drivers/" +
    encodeURIComponent(id) +
    ".json";
}


/* =========================================================
   MESSAGE
========================================================= */

function showMessage(text, success = true) {

  const box =
    document.getElementById("message");

  box.textContent = text;

  box.style.color =
    success
      ? "#15803d"
      : "#dc2626";
}


/* =========================================================
   FIREBASE UPDATE
========================================================= */

async function updateDriver(data) {

  try {

    const response =
      await fetch(
        driverPath(),
        {
          method: "PATCH",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify(data)
        }
      );


    if (!response.ok) {

      throw new Error(
        "Firebase update failed"
      );

    }


    showMessage(
      "Updated successfully"
    );


    document
      .getElementById("showName")
      .textContent =
        document
          .getElementById("driverName")
          .value;


    document
      .getElementById("showDuty")
      .textContent =
        document
          .getElementById("dutyStatus")
          .value;


  } catch (error) {

    console.error(error);

    showMessage(
      "Firebase update failed",
      false
    );

  }
}


/* =========================================================
   GO ONLINE
========================================================= */

function goOnline() {

  document
    .getElementById("statusBox")
    .className =
      "status online";


  document
    .getElementById("statusBox")
    .textContent =
      "DRIVER ONLINE";


  document
    .getElementById("dutyStatus")
    .value =
      "ON";


  updateDriver({

    online: true,

    dutyStatus: "ON",

    name:
      document
        .getElementById("driverName")
        .value

  });


  getLocation();

  startBookingMonitor();

}


/* =========================================================
   GO OFFLINE
========================================================= */

function goOffline() {

  document
    .getElementById("statusBox")
    .className =
      "status offline";


  document
    .getElementById("statusBox")
    .textContent =
      "DRIVER OFFLINE";


  document
    .getElementById("dutyStatus")
    .value =
      "OFF";


  updateDriver({

    online: false,

    dutyStatus: "OFF",

    name:
      document
        .getElementById("driverName")
        .value

  });


  stopBookingMonitor();

  stopBookingAlert();

}


/* =========================================================
   LOCATION
========================================================= */

function getLocation() {

  if (!navigator.geolocation) {

    showMessage(
      "Location is not supported",
      false
    );

    return;
  }


  navigator.geolocation.getCurrentPosition(

    function(position) {

      const latitude =
        position.coords.latitude;


      const longitude =
        position.coords.longitude;


      document
        .getElementById("showLat")
        .textContent =
          latitude.toFixed(6);


      document
        .getElementById("showLng")
        .textContent =
          longitude.toFixed(6);


      updateDriver({

        location: {

          latitude:
            latitude,

          longitude:
            longitude

        }

      });

    },


    function(error) {

      console.error(error);

      showMessage(
        "Please allow location permission",
        false
      );

    },


    {

      enableHighAccuracy: true,

      timeout: 15000,

      maximumAge: 0

    }

  );

}


/* =========================================================
   DUTY STATUS CHANGE
========================================================= */

document
  .getElementById("dutyStatus")
  .addEventListener(
    "change",
    function() {

      const value =
        this.value;


      updateDriver({

        dutyStatus:
          value,

        online:
          value === "ON"

      });


      document
        .getElementById("showDuty")
        .textContent =
          value;


      if (value === "ON") {

        document
          .getElementById("statusBox")
          .className =
            "status online";

        document
          .getElementById("statusBox")
          .textContent =
            "DRIVER ONLINE";

        startBookingMonitor();

      } else {

        document
          .getElementById("statusBox")
          .className =
            "status offline";

        document
          .getElementById("statusBox")
          .textContent =
            "DRIVER OFFLINE";

        stopBookingMonitor();

      }

    }
  );


/* =========================================================
   BOOKING ALERT SOUND
========================================================= */

let audioContext = null;

let bookingAlarmTimer = null;

let bookingMonitorTimer = null;

let knownBookings = new Set();

let firstBookingCheck = true;


/*
   Browser security के कारण sound पहली बार
   user interaction के बाद unlock होगा.
*/

function unlockAudio() {

  try {

    if (!audioContext) {

      audioContext =
        new (
          window.AudioContext ||
          window.webkitAudioContext
        )();

    }


    if (
      audioContext.state ===
      "suspended"
    ) {

      audioContext.resume();

    }

  } catch (error) {

    console.log(
      "Audio unlock failed",
      error
    );

  }

}


document.addEventListener(
  "click",
  unlockAudio
);

document.addEventListener(
  "touchstart",
  unlockAudio
);


/* =========================================================
   ONE ALARM BEEP
========================================================= */

function playAlarmBeep() {

  if (!audioContext) {

    unlockAudio();

  }


  if (!audioContext) {
    return;
  }


  const now =
    audioContext.currentTime;


  const oscillator =
    audioContext.createOscillator();


  const gain =
    audioContext.createGain();


  oscillator.type =
    "square";


  oscillator.frequency
    .setValueAtTime(
      1100,
      now
    );


  oscillator.frequency
    .linearRampToValueAtTime(
      700,
      now + 0.25
    );


  gain.gain
    .setValueAtTime(
      0.0001,
      now
    );


  gain.gain
    .linearRampToValueAtTime(
      0.45,
      now + 0.03
    );


  gain.gain
    .linearRampToValueAtTime(
      0.0001,
      now + 0.28
    );


  oscillator.connect(gain);

  gain.connect(
    audioContext.destination
  );


  oscillator.start(now);

  oscillator.stop(
    now + 0.3
  );

}


/* =========================================================
   START BOOKING ALARM
========================================================= */

function startBookingAlert() {

  const alertBox =
    document.getElementById(
      "bookingAlert"
    );


  alertBox.classList.add(
    "active"
  );


  stopBookingAlertSound();


  playAlarmBeep();


  bookingAlarmTimer =
    setInterval(
      playAlarmBeep,
      650
    );


  /* Phone vibration */

  if (
    "vibrate" in navigator
  ) {

    navigator.vibrate([
      400,
      200,
      400,
      200,
      700
    ]);

  }

}


/* =========================================================
   STOP BOOKING ALERT SOUND
========================================================= */

function stopBookingAlertSound() {

  if (
    bookingAlarmTimer
  ) {

    clearInterval(
      bookingAlarmTimer
    );

    bookingAlarmTimer =
      null;

  }


  if (
    "vibrate" in navigator
  ) {

    navigator.vibrate(0);

  }

}


/* =========================================================
   STOP BOOKING ALERT
========================================================= */

function stopBookingAlert() {

  stopBookingAlertSound();


  document
    .getElementById(
      "bookingAlert"
    )
    .classList.remove(
      "active"
    );

}


/* =========================================================
   GET BOOKING DATA
========================================================= */

async function checkBookings() {

  try {

    const response =
      await fetch(
        DATABASE_URL +
        BOOKINGS_PATH +
        ".json"
      );


    if (!response.ok) {

      throw new Error(
        "Booking fetch failed"
      );

    }


    const data =
      await response.json();


    if (!data) {

      return;

    }


    const currentKeys =
      Object.keys(data);


    /*
       पहली बार database check करते समय
       पुराने bookings पर alarm नहीं बजेगा.
    */

    if (firstBookingCheck) {

      currentKeys.forEach(
        key => {
          knownBookings.add(key);
        }
      );

      firstBookingCheck =
        false;

      return;

    }


    /*
       नई booking detect
    */

    let newBookingKey = null;


    for (
      const key of currentKeys
    ) {

      if (
        !knownBookings.has(key)
      ) {

        newBookingKey =
          key;

        break;

      }

    }


    /*
       नई booking मिली
    */

    if (newBookingKey) {

      const booking =
        data[newBookingKey];


      knownBookings.add(
        newBookingKey
      );


      showNewBooking(
        booking
      );

    }


    /*
       Current keys याद रखें
    */

    currentKeys.forEach(
      key => {
        knownBookings.add(key);
      }
    );


  } catch (error) {

    console.log(
      "Booking check:",
      error
    );

  }

}


/* =========================================================
   SHOW NEW BOOKING
========================================================= */

function showNewBooking(
  booking
) {

  let html =
    "<b>New booking received!</b><br><br>";


  if (booking) {

    if (booking.name) {

      html +=
        "<b>Customer:</b> " +
        escapeHtml(
          booking.name
        ) +
        "<br>";

    }


    if (booking.customerName) {

      html +=
        "<b>Customer:</b> " +
        escapeHtml(
          booking.customerName
        ) +
        "<br>";

    }


    if (booking.phone) {

      html +=
        "<b>Phone:</b> " +
        escapeHtml(
          booking.phone
        ) +
        "<br>";

    }


    if (booking.mobile) {

      html +=
        "<b>Mobile:</b> " +
        escapeHtml(
          booking.mobile
        ) +
        "<br>";

    }


    if (booking.pickup) {

      html +=
        "<b>Pickup:</b> " +
        escapeHtml(
          booking.pickup
        ) +
        "<br>";

    }


    if (booking.drop) {

      html +=
        "<b>Drop:</b> " +
        escapeHtml(
          booking.drop
        ) +
        "<br>";

    }


    if (booking.pickupLocation) {

      html +=
        "<b>Pickup:</b> " +
        escapeHtml(
          booking.pickupLocation
        ) +
        "<br>";

    }


    if (booking.destination) {

      html +=
        "<b>Destination:</b> " +
        escapeHtml(
          booking.destination
        ) +
        "<br>";

    }


    if (booking.date) {

      html +=
        "<b>Date:</b> " +
        escapeHtml(
          booking.date
        ) +
        "<br>";

    }


    if (booking.time) {

      html +=
        "<b>Time:</b> " +
        escapeHtml(
          booking.time
        ) +
        "<br>";

    }

  }


  document
    .getElementById(
      "bookingDetails"
    )
    .innerHTML =
      html;


  startBookingAlert();

}


/* =========================================================
   SECURITY
========================================================= */

function escapeHtml(value) {

  return String(value)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


/* =========================================================
   START BOOKING MONITOR
========================================================= */

function startBookingMonitor() {

  if (
    bookingMonitorTimer
  ) {

    return;

  }


  /*
     Existing bookings को याद कर लें.
  */

  firstBookingCheck =
    true;


  checkBookings();


  /*
     हर 3 seconds नई booking check होगी.
  */

  bookingMonitorTimer =
    setInterval(
      checkBookings,
      3000
    );

}


/* =========================================================
   STOP BOOKING MONITOR
========================================================= */

function stopBookingMonitor() {

  if (
    bookingMonitorTimer
  ) {

    clearInterval(
      bookingMonitorTimer
    );

    bookingMonitorTimer =
      null;

  }

}


/* =========================================================
   INITIAL AUDIO UNLOCK
========================================================= */

unlockAudio();


</script>

</body>
</html>
