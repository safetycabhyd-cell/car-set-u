<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Car Set U - Driver</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      color: #222;
    }

    .header {
      background: #111827;
      color: white;
      padding: 18px;
      text-align: center;
    }

    .header h1 {
      margin: 0;
      font-size: 24px;
    }

    .header p {
      margin: 6px 0 0;
      font-size: 14px;
    }

    .container {
      max-width: 500px;
      margin: 20px auto;
      padding: 15px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 15px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.10);
    }

    .status {
      text-align: center;
      padding: 15px;
      border-radius: 12px;
      background: #eee;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .online {
      background: #d1fae5;
      color: #065f46;
    }

    .offline {
      background: #fee2e2;
      color: #991b1b;
    }

    label {
      display: block;
      margin-top: 12px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input,
    select {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      width: 100%;
      border: none;
      padding: 14px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      margin-top: 12px;
      cursor: pointer;
    }

    .green {
      background: #16a34a;
      color: white;
    }

    .red {
      background: #dc2626;
      color: white;
    }

    .blue {
      background: #2563eb;
      color: white;
    }

    .info {
      line-height: 1.8;
    }

    #message {
      text-align: center;
      margin-top: 12px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>🚕 Car Set U</h1>
    <p>Driver Panel</p>
  </div>

  <div class="container">

    <div class="card">

      <div id="statusBox" class="status offline">
        DRIVER OFFLINE
      </div>

      <label>Driver ID</label>
      <input id="driverId" value="DRIVER001">

      <label>Driver Name</label>
      <input id="driverName" value="Driver 001">

      <label>Duty Status</label>
      <select id="dutyStatus">
        <option value="OFF">OFF</option>
        <option value="ON">ON</option>
      </select>

      <button class="green" onclick="goOnline()">
        GO ONLINE
      </button>

      <button class="red" onclick="goOffline()">
        GO OFFLINE
      </button>

      <button class="blue" onclick="getLocation()">
        UPDATE MY LOCATION
      </button>

      <div id="message"></div>

    </div>

    <div class="card info">
      <h3>Driver Information</h3>

      <div>
        <b>Driver:</b>
        <span id="showName">Driver 001</span>
      </div>

      <div>
        <b>Duty:</b>
        <span id="showDuty">OFF</span>
      </div>

      <div>
        <b>Latitude:</b>
        <span id="showLat">-</span>
      </div>

      <div>
        <b>Longitude:</b>
        <span id="showLng">-</span>
      </div>

    </div>

  </div>

<script>

const DATABASE_URL =
"https://car-set-u-default-rtdb.asia-southeast1.firebasedatabase.app";

function driverPath() {
  const id = document.getElementById("driverId").value.trim();
  return DATABASE_URL + "/drivers/" + encodeURIComponent(id) + ".json";
}

function showMessage(text, success = true) {
  const box = document.getElementById("message");

  box.textContent = text;
  box.style.color = success ? "#15803d" : "#dc2626";
}

async function updateDriver(data) {

  try {

    const response = await fetch(driverPath(), {
      method: "PATCH",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify(data)
    });

    if (!response.ok) {
      throw new Error("Firebase update failed");
    }

    showMessage("Updated successfully");

    document.getElementById("showName").textContent =
      document.getElementById("driverName").value;

    document.getElementById("showDuty").textContent =
      document.getElementById("dutyStatus").value;

  } catch (error) {

    console.error(error);
    showMessage("Firebase update failed", false);

  }
}

function goOnline() {

  document.getElementById("statusBox").className =
    "status online";

  document.getElementById("statusBox").textContent =
    "DRIVER ONLINE";

  updateDriver({
    online: true,
    dutyStatus: "ON",
    name: document.getElementById("driverName").value
  });

  getLocation();
}

function goOffline() {

  document.getElementById("statusBox").className =
    "status offline";

  document.getElementById("statusBox").textContent =
    "DRIVER OFFLINE";

  updateDriver({
    online: false,
    dutyStatus: "OFF",
    name: document.getElementById("driverName").value
  });
}

function getLocation() {

  if (!navigator.geolocation) {
    showMessage("Location is not supported", false);
    return;
  }

  navigator.geolocation.getCurrentPosition(

    function(position) {

      const latitude =
        position.coords.latitude;

      const longitude =
        position.coords.longitude;

      document.getElementById("showLat").textContent =
        latitude.toFixed(6);

      document.getElementById("showLng").textContent =
        longitude.toFixed(6);

      updateDriver({

        location: {
          latitude: latitude,
          longitude: longitude
        }

      });

    },

    function(error) {

      showMessage(
        "Please allow location permission",
        false
      );

    },

    {
      enableHighAccuracy: true,
      timeout: 15000,
      maximumAge: 0
    }

  );
}

document
  .getElementById("dutyStatus")
  .addEventListener("change", function() {

    updateDriver({
      dutyStatus: this.value
    });

    document.getElementById("showDuty").textContent =
      this.value;

  });

</script>

</body>
</html>
