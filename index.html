function normalizePhone(value) {

  const digits =
    (value || "").replace(/\D/g, "");

  if (digits.length === 10) {

    return "+91" + digits;

  }

  if (
    digits.length === 12 &&
    digits.startsWith("91")
  ) {

    return "+" + digits;

  }

  return "";

}


function getCustomerPhone() {

  return normalizePhone(
    localStorage.getItem(
      "carSetU_phone"

  );

}

    auth.currentUser;

    getCustomerPhone();

    return "";

  }

  if (!phone) {

    return user.uid;

  }

  return (
    user.uid +
    "_" +
    phone.replace(/\D/g, "")
  );

}


function getCounterDocumentId() {

/* =====================================================
   CUSTOMER BOOKING ID
===================================================== */

async function createCustomerBookingId() {

  if (!auth.currentUser) {

    throw new Error(
      "Customer login required."
    );

  }

  const counterId =
    getCounterDocumentId();

  if (!counterId) {

    throw new Error(
      "Customer identification missing."
    );

  }

  const counterRef =
    doc(
      db,
      "customerBookingCounters",
      counterId
    );

  const bookingNumber =
    await runTransaction(
      db,
      async transaction => {

        const counterSnap =
          await transaction.get(
            counterRef
          );

        let nextNumber = 1;

        if (counterSnap.exists()) {

          const oldNumber =
            Number(
              counterSnap.data()
                .lastNumber || 0
            );

          nextNumber =
            oldNumber + 1;

        }

        transaction.set(
          counterRef,
          {

            customerUid:
              auth.currentUser.uid,

            customerPhone:
              getCustomerPhone(),

            lastNumber:
              nextNumber,

            updatedAt:
              serverTimestamp()

          },
          {
            merge: true
          }
        );

        return nextNumber;

      }
    );

  return (
    "BC" +
    String(bookingNumber)
      .padStart(3, "0")
  );

}

function getTodayString() {

  const d =
    new Date();

  return (

    d.getFullYear() +

    "-" +

    String(
      d.getMonth() + 1
    ).padStart(2, "0") +

    "-" +

    String(
      d.getDate()
    ).padStart(2, "0")

  );

}


function setDateDefaults(
  dateId,
  pickupId,
  dropId
) {

  const d =
    document.getElementById(
      dateId
    );

  if (d) {

    d.value =
      getTodayString();

  }


  const now =
    new Date();


  const pickup =
    document.getElementById(
      pickupId
    );

  const drop =
    document.getElementById(
      dropId
    );


  if (pickup) {

    pickup.value =

      String(
        now.getHours()
      ).padStart(2, "0") +

      ":" +

      String(
        now.getMinutes()
      ).padStart(2, "0");

  }


  if (drop) {

    const later =
      new Date(
        now.getTime() +
        60 * 60000
      );


    drop.value =

      String(
        later.getHours()
      ).padStart(2, "0") +

      ":" +

      String(
        later.getMinutes()
      ).padStart(2, "0");

  }

}


/* =====================================================

===================================================== */

window.useCurrentLocation =
function (inputId) {

  if (!navigator.geolocation) {

    alert(
      "GPS is not supported on this device."
    );

    return;

  }


  const status =
    document.getElementById(
      inputId + "Status"
    );


  if (status) {

    status.classList.remove(
      "hidden"
    );

    status.textContent =
      "📍 Getting current location...";

  }


  navigator.geolocation.getCurrentPosition(

    position => {

      const lat =
        position.coords.latitude;

      const lon =
        position.coords.longitude;


      currentPickupCoords = {

        lat:
          lat,

        lon:
          lon,

        source:
          "gps"

      };


      document.getElementById(
        inputId
      ).value =

        "Current Location (" +
        lat.toFixed(6) +
        ", " +
        lon.toFixed(6) +
        ")";


      if (status) {

        status.textContent =
          "✅ GPS location selected.";

      }

    },


    error => {

      console.error(error);


      if (status) {

        status.textContent =
          "❌ GPS location unavailable.";

      }


      alert(
        "Current Location नहीं मिल पाई.\n" +
        "Please allow Location permission."
      );

    },


    {

      enableHighAccuracy:
        true,

      timeout:
        15000,

      maximumAge:
        0

    }

  );

};

/* =====================================================
   GEOCODING
===================================================== */

async function geocodePlace(place) {

  const clean =
    place
      .trim()
      .toLowerCase();


  const gpsMatch =
    place.match(
      /Current Location\s*\(([-\d.]+),\s*([-\d.]+)\)/i
    );


  if (gpsMatch) {

    return {

      lat:
        Number(
          gpsMatch[1]
        ),

      lon:
        Number(
          gpsMatch[2]
        ),

      name:
        "Current Location"

    };

  }


  const match =
    Object.keys(
      knownLocations
    ).find(
      k =>
        clean.includes(k)
    );


  if (match) {

    return {

      lat:
        knownLocations[
          match
        ][0],

      lon:
        knownLocations[
          match
        ][1],

      name:
        place

    };

  }


  let q =
    place.trim();


  if (
    !q
      .toLowerCase()
      .includes("india")
  ) {

    q +=
      ", Telangana, India";

  }


  const url =

    "https://nominatim.openstreetmap.org/search" +

    "?format=jsonv2" +

    "&limit=1" +

    "&countrycodes=in" +

    "&q=" +

    encodeURIComponent(q);


  const response =
    await fetch(url);


  if (!response.ok) {

    throw new Error(
      "Location search failed."
    );

  }


  const data =
    await response.json();


  if (!data.length) {

    throw new Error(
      "Location not found: " +
      place
    );

  }


  return {

    lat:
      Number(
        data[0].lat
      ),

    lon:
      Number(
        data[0].lon
      ),

    name:
      data[0].display_name

  };

}


/* =====================================================
   ROUTE
===================================================== */

async function getRoute(points) {

  const coords =
    points
      .map(
        p =>
          p.lon + "," + p.lat
      )
      .join(";");


  const url =

    "https://router.project-osrm.org/route/v1/driving/" +

    coords +

    "?overview=full&geometries=geojson";


  const response =
    await fetch(url);


  if (!response.ok) {

    throw new Error(
      "Route service failed."
    );

  }


  const data =
    await response.json();


  if (
    !data.routes ||
    !data.routes.length
  ) {

    throw new Error(
      "Route not found."
    );

  }


  return data.routes[0];

}

window.showSingleRoute =
async function () {

  const pickup =
    document.getElementById(
      "singlePickup"
    ).value.trim();


  const drop =
    document.getElementById(
      "singleDrop"
    ).value.trim();


  if (!pickup || !drop) {

    alert(
      "Please enter Pickup and Final Destination."
    );

    return;

  }


  const map =
    initMapFor(
      "singleRouteMap"
    );


  const status =
    document.getElementById(
      "singleMapStatus"
    );


  status.textContent =
    "🔎 Finding locations...";


  try {

    const points =
      await Promise.all([

        geocodePlace(
          pickup
        ),

        geocodePlace(
          drop
        )

      ]);


    status.textContent =
      "🛣️ Calculating route...";


    if (routeLine) {

      map.removeLayer(
        routeLine
      );

    }


    routeMarkers.forEach(
      marker =>
        map.removeLayer(
          marker
        )
    );


    routeMarkers = [];


    const route =
      await getRoute(
        points
      );


    points.forEach(
      (
        point,
        index
      ) => {

        const marker =
          L.marker(
            [
              point.lat,
              point.lon
            ]
          )
          .addTo(map)
          .bindPopup(

            index === 0

              ?

              "📍 Pickup<br>" +
              escapeHtml(
                point.name
              )

              :

              "🏁 Destination<br>" +
              escapeHtml(
                point.name
              )

          );


        routeMarkers.push(
          marker
        );

      }
    );


    routeLine =
      L.geoJSON(
        route.geometry,
        {

          style: {

            weight:
              6,

            opacity:
              0.85

          }

        }
      )
      .addTo(map);


    map.fitBounds(
      routeLine.getBounds(),
      {
        padding:
          [25, 25]
      }
    );


    const km =
      (
        route.distance /
        1000
      ).toFixed(1);


    const minutes =
      Math.round(
        route.duration /
        60
      );


    const hours =
      Math.floor(
        minutes / 60
      );


    const mins =
      minutes % 60;


    const time =
      hours > 0

        ?

        hours +
        " hr " +
        mins +
        " min"

        :

        mins +
        " min";


    document.getElementById(
      "singleDistance"
    ).textContent =
      km + " KM";


    document.getElementById(
      "singleDuration"
    ).textContent =
      time;


    document.getElementById(
      "singleRouteSummary"
    ).classList.remove(
      "hidden"
    );


    status.textContent =
      "✅ Complete route found.";

  }
  catch (error) {

    console.error(error);

    status.textContent =
      "❌ " +
      error.message;


    alert(
      "Route नहीं बन पाया.\n\n" +
      error.message
    );

  }

};


/* =====================================================
   DRIVER ID NORMALIZATION
===================================================== */

function normalizeDriverId(value) {

  let id =
    (value || "")
      .trim()
      .toUpperCase()
      .replace(/\s+/g, "");


  if (
    /^DRIVER\d+$/.test(id)
  ) {

    id =
      "DC" +
      id.replace(
        "DRIVER",
        ""
      );

  }


  return id;

}

/* =====================================================
   START VOICE RECORDING
===================================================== */

window.startVoice =
function (prefix) {

  if (
    !navigator.mediaDevices ||
    !navigator.mediaDevices
      .getUserMedia
  ) {

    alert(
      "Voice recording is not supported."
    );

    return;

  }


  navigator.mediaDevices
    .getUserMedia({
      audio: true
    })
    .then(
      stream => {

        voiceChunks = [];


        recorder =
          new MediaRecorder(
            stream
          );


        recorder.ondataavailable =
          event => {

            if (
              event.data.size > 0
            ) {

              voiceChunks.push(
                event.data
              );

            }

          };


        recorder.onstop =
          () => {

            voiceBlob =
              new Blob(
                voiceChunks,
                {
                  type:
                    "audio/webm"
                }
              );


            const player =
              document.getElementById(
                prefix +
                "VoicePlayer"
              );


            if (player) {

              player.src =
                URL.createObjectURL(
                  voiceBlob
                );

              player.classList.remove(
                "hidden"
              );

            }


            const status =
              document.getElementById(
                prefix +
                "VoiceStatus"
              );


            if (status) {

              status.textContent =
                "✅ Voice recorded.";

            }


            stream
              .getTracks()
              .forEach(
                track =>
                  track.stop()
              );

          };


        recorder.start();


        const status =
          document.getElementById(
            prefix +
            "VoiceStatus"
          );


        if (status) {

          status.textContent =
            "🔴 Recording...";

        }

      }
    )
    .catch(
      error => {

        console.error(error);

        alert(
          "Microphone permission required."
        );

      }
    );

};


/* =====================================================
   STOP VOICE
===================================================== */

window.stopVoice =
function () {

  if (
    recorder &&
    recorder.state !==
      "inactive"
  ) {

    recorder.stop();

  }

};

window.playVoice =

/* =====================================================
   UPLOAD VOICE
===================================================== */

async function uploadVoice(
  path
) {

  if (!voiceBlob) {

    return "";

  }


  const voiceRef =
    ref(
      storage,
      path
    );


  await uploadBytes(
    voiceRef,
    voiceBlob
  );


  return await getDownloadURL(
    voiceRef
  );

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value) {

  return String(
    value ?? ""
  )

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}

      Remove previous event route.
    */

    map.eachLayer(
      layer => {

        if (
          layer instanceof
          L.Polyline
        ) {

          map.removeLayer(
            layer
          );

        }

      }
    );


    const line =
      L.geoJSON(
        route.geometry,
        {

          style: {

            weight:
              6,

            opacity:
              0.85

          }

        }
      )
      .addTo(map);


    map.fitBounds(
      line.getBounds(),
      {
        padding:
          [25, 25]
      }
    );


    const km =
      (
        route.distance /
        1000
      ).toFixed(1);


    const mins =
      Math.round(
        route.duration /
        60
      );


    document.getElementById(
      "eventDistance"
    ).textContent =
      km + " KM";


    document.getElementById(
      "eventDuration"
    ).textContent =
      mins + " min";


    document.getElementById(
      "eventRouteSummary"
    ).classList.remove(
      "hidden"
    );


    status.textContent =
      "✅ Complete route found.";

  }
  catch (error) {

    console.error(error);

    status.textContent =
      "❌ " +
      error.message;


    alert(
      "Route नहीं बन पाया.\n\n" +
      error.message
    );

  }

};

   LOAD MY BOOKINGS
===================================================== */

function loadMyBookings() {

  if (!auth.currentUser) {

    return;

  }


  if (unsubscribeBookings) {

    unsubscribeBookings();

  }


  const q =
    query(

      collection(
        db,
        "cabBookings"
      ),

      where(
        "customerUid",
        "==",
        auth.currentUser.uid
      )

    );


  unsubscribeBookings =
    onSnapshot(

      q,

      snapshot => {

        const bookings = [];


        snapshot.forEach(
          d => {

            bookings.push({

              id:
                d.id,

              ...d.data()

            });

          }
        );


        updateTodayCount(
          bookings
        );

      },


      error => {

        console.error(
          "Booking listener error:",
          error
        );

      }

    );

}


/* =====================================================
   TODAY BOOKING COUNT
===================================================== */

async function updateTodayCount(
  bookings
) {

  const today =
    getTodayString();


  let eventCount = 0;


  try {

    const q =
      query(

        collection(
          db,
          "eventBookings"
        ),

        where(
          "customerUid",
          "==",
          auth.currentUser.uid
        )

      );


    const snap =
      await getDocs(q);


    snap.forEach(
      d => {

        const booking =
          d.data();


        if (
          (
            booking.bookingDate ||
            booking.pickupDate
          ) === today
        ) {

          eventCount++;

        }

      }
    );

  }
  catch (error) {

    console.error(error);

  }


  const singleCount =
    bookings.filter(

      booking =>
        (
          booking.bookingDate ||
          booking.pickupDate
        ) === today

    ).length;


  const total =
    singleCount +
    eventCount;


  const countElement =
    document.getElementById(
      "todayBookingCount"
    );


  if (countElement) {

    countElement.textContent =
      total;

  }


  const parts =
    today.split("-");


  const dateElement =
    document.getElementById(
      "todayDate"
    );


  if (dateElement) {

    dateElement.textContent =
      parts[2] +
      "/" +
      parts[1] +
      "/" +
      parts[0];

  }

}

   RENDER MY BOOKINGS
===================================================== */

async function renderBookings() {

  const list =
    document.getElementById(
      "bookingList"
    );


  if (!list) {

    return;

  }


  list.innerHTML = `

<div class="notice blue">

Loading bookings...

</div>

`;


  if (!auth.currentUser) {

    return;

  }


  try {

    const arrays = [];


    /*
      IMPORTANT:
      Only current customer bookings.
    */

    for (
      const collectionName
      of [
        "cabBookings",
        "eventBookings"
      ]
    ) {

      const q =
        query(

          collection(
            db,
            collectionName
          ),

          where(
            "customerUid",
            "==",
            auth.currentUser.uid
          )

        );


      const snap =
        await getDocs(q);


      snap.forEach(
        d => {

          arrays.push({

            id:
              d.id,

            collectionName:
              collectionName,

            ...d.data()

          });

        }
      );

    }


    /*
      Second protection:
      Phone must match when saved.
    */

    const phone =
      getCustomerPhone();


    const customerArrays =
      arrays.filter(
        booking => {

          if (
            !booking.customerPhone
          ) {

            return true;

          }


          return (
            normalizePhone(
              booking.customerPhone
            ) === phone
          );

        }
      );


    customerArrays.sort(
      (a, b) =>
        (
          b.createdAt?.seconds || 0
        ) -
        (
          a.createdAt?.seconds || 0
        )
    );


    list.innerHTML =
      "";


    if (!customerArrays.length) {

      list.innerHTML = `

<div class="notice blue">

No bookings yet.

</div>

`;

      return;

    }


    customerArrays.forEach(
      booking => {

        const card =
          document.createElement(
            "div"
          );


        card.className =
          "booking-card";


        const status =
          String(
            booking.status ||
            "pending"
          ).toLowerCase();


        let cls =
          "status";


        if (
          status === "accepted" ||
          status === "running" ||
          status === "started"
        ) {

          cls +=
            " accepted";

        }


        if (
          status ===
          "completed"
        ) {

          cls +=
            " completed";

        }


        if (
          status ===
          "rejected"
        ) {

          cls +=
            " rejected";

        }


        const displayBookingId =
          booking.bookingId ||
          "BC---";


        let html = `

<span class="${cls}">

${escapeHtml(
  status.toUpperCase()
)}

</span>


<div class="booking-row">

<strong>
BOOKING ID
</strong>

<div class="booking-value">

${escapeHtml(
  displayBookingId
)}

</div>

</div>

`;


        /*
          EVENT DETAILS
        */

        if (
          booking.collectionName ===
          "eventBookings"
        ) {

          html += `

<div class="booking-row">

<strong>
EVENT
</strong>

<div class="booking-value">

${escapeHtml(
  booking.eventName ||
  "Event"
)}

</div>

</div>


<div class="booking-row">

<strong>
CAR
</strong>

<div class="booking-value">

${escapeHtml(
  String(
    booking.carNumber ||
    "-"
  )
)}

 /
${escapeHtml(
  String(
    booking.totalCars ||
    "-"
  )
)}

</div>

</div>

`;

        }


        /*
          PICKUP / DROP
        */

        html += `

<div class="booking-row">

<strong>
📍 PICKUP
</strong>

<div class="booking-value">

${escapeHtml(
  booking.pickup ||
  "-"
)}

</div>

</div>


<div class="booking-row">

<strong>
🏁 DROP
</strong>

<div class="booking-value">

${escapeHtml(
  booking.destination ||
  "-"
)}

</div>

</div>


<div class="booking-row">

<strong>
📅 DATE
</strong>

<div class="booking-value">

${escapeHtml(
  booking.pickupDate ||
  "-"
)}

</div>

</div>


<div class="booking-row">

<strong>
⏰ TIME
</strong>

<div class="booking-value">

${escapeHtml(
  booking.pickupTime ||
  "-"
)}

</div>

</div>


<div class="booking-row">

<strong>
🆔 DRIVER
</strong>

<div class="booking-value">

${escapeHtml(
  booking.driverId ||
  "-"
)}

</div>

</div>


<div class="booking-row">

<strong>
👨‍✈️ DRIVER
</strong>

<div class="booking-value">

${escapeHtml(
  booking.driverName ||
  "-"
)}

</div>

</div>


<div class="booking-row">

<strong>
🚕 VEHICLE
</strong>

<div class="booking-value">

${escapeHtml(
  booking.vehicleNumber ||
  "-"
)}

</div>

</div>

`;


        /*
          DRIVER PHOTO
        */

        if (
          booking.driverPhoto
        ) {

          html += `

<img
class="driver-photo"
src="${escapeHtml(
  booking.driverPhoto
)}"
alt="Driver Photo">

`;

        }


        /*
          DRIVER MOBILE
        */

        if (
          booking.driverMobile &&
          (
            status === "accepted" ||
            status === "running" ||
            status === "started" ||
            status === "completed"
          )
        ) {

          html += `

<div class="booking-row">

<strong>
📞 DRIVER MOBILE
</strong>

<div class="booking-value">

${escapeHtml(
  booking.driverMobile
)}

</div>

</div>

`;

        }


        /*
          VOICE NOTE
        */

        if (
          booking.voiceNoteURL
        ) {

          html += `

<div class="voice-box">

<b>
🎙 Booking Voice Note
</b>

<br><br>

<audio
controls
src="${escapeHtml(
  booking.voiceNoteURL
)}">
</audio>

</div>

`;

        }


        /*
          DRIVER CLOSE REQUEST
        */

        if (
          booking.closeRequested === true &&
          booking.customerCloseApproved !== true &&
          status !== "completed"
        ) {

          html += `

<div class="close-request">

<b>
⚠️ Driver requested booking close.
</b>

<br><br>


<button
class="primary green"
data-close-id="${escapeHtml(
  booking.id
)}"
data-close-collection="${escapeHtml(
  booking.collectionName
)}">

✅ Approve Close

</button>


<button
class="primary gray"
data-keep-id="${escapeHtml(
  booking.id
)}"
data-keep-collection="${escapeHtml(
  booking.collectionName
)}">

❌ Keep Open

</button>

</div>

`;

        }


        card.innerHTML =
          html;


        /*
          APPROVE CLOSE
        */

        const approve =
          card.querySelector(
            "[data-close-id]"
          );


        if (approve) {

          approve.onclick =
            async () => {

              try {

                await updateDoc(

                  doc(
                    db,
                    approve.dataset
                      .closeCollection,
                    approve.dataset
                      .closeId
                  ),

                  {

                    status:
                      "completed",

                    customerCloseApproved:
                      true,

                    closedAt:
                      serverTimestamp()

                  }

                );


                alert(
                  "✅ Booking Closed Successfully."
                );


                renderBookings();

              }
              catch (error) {

                console.error(
                  error
                );

                alert(
                  "Close approval failed.\n" +
                  error.message
                );

              }

            };

        }


        /*
          KEEP OPEN
        */

        const keep =
          card.querySelector(
            "[data-keep-id]"
          );


        if (keep) {

          keep.onclick =
            async () => {

              try {

                await updateDoc(

                  doc(
                    db,
                    keep.dataset
                      .keepCollection,
                    keep.dataset
                      .keepId
                  ),

                  {

                    closeRequested:
                      false

                  }

                );


                renderBookings();

              }
              catch (error) {

                console.error(
                  error
                );

                alert(
                  error.message
                );

              }

            };

        }


        list.appendChild(
          card
        );

      }
    );

  }
  catch (error) {

    console.error(error);


    list.innerHTML = `

<div class="notice red">

❌ Booking data load failed.

<br><br>

${escapeHtml(
  error.message
)}

</div>

`;

  }

}
