function setupRecaptcha(){

  if(recaptchaVerifier)
    return;


  recaptchaVerifier =
    new RecaptchaVerifier(

      auth,

      "recaptcha-container",

      {

        size:"normal"

      }

    );


  recaptchaVerifier.render();

}


window.sendOTP =
async function(){

  try{

    setupRecaptcha();


    let phone =
      document
      .getElementById("phoneNumber")
      .value
      .trim();


    if(!phone){

      alert(
        "Please enter mobile number."
      );

      return;

    }


    if(!phone.startsWith("+")){

      phone =
        "+91"+phone;

    }


    confirmationResult =
      await signInWithPhoneNumber(

        auth,

        phone,

        recaptchaVerifier

      );


    document
      .getElementById("otpBox")
      .classList
      .remove("hidden");


    alert(
      "OTP sent successfully."
    );


  }
  catch(error){

    console.error(error);


    alert(

      "OTP could not be sent.\n\n"+
      error.message

    );

  }

};


window.verifyOTP =
async function(){

  try{

    const otp =
      document
      .getElementById("otpCode")
      .value
      .trim();


    if(otp.length!==6){

      alert(
        "Please enter 6 digit OTP."
      );

      return;

    }


    if(!confirmationResult){

      alert(
        "Please request OTP first."
      );

      return;

    }


    await confirmationResult.confirm(
      otp
    );


    alert(
      "Login successful."
    );

  }
  catch(error){

    console.error(error);


    alert(

      "Invalid OTP.\n\n"+
      error.message

    );

  }

};

window.previewPhotos =
function(){

  const input =
    document.getElementById(
      "carPhotos"
    );


  const preview =
    document.getElementById(
      "photoPreview"
    );


  preview.innerHTML = "";


  const files =
    Array.from(input.files);


  if(files.length > 6){

    alert(
      "Maximum 6 car photos allowed."
    );


    input.value = "";


    return;

  }


  files.forEach(file=>{

    if(
      !file.type.startsWith("image/")
    )
      return;


    const reader =
      new FileReader();


    reader.onload =
      function(e){

        const img =
          document.createElement("img");


        img.src =
          e.target.result;


        preview.appendChild(img);

      };


    reader.readAsDataURL(file);

  });

};

let currentMedia = [];

let currentIndex = 0;


window.openCarViewer =
function(id,type){

  const car =
    type==="buy"

    ?

    buyCars.find(
      x=>x.id===id
    )

    :

    sellCars.find(
      x=>x.id===id
    );


  if(!car){

    alert(
      "Car details not found."
    );


    return;

  }


  currentMedia = [];


  (car.photos || [])
  .forEach(photo=>{

    currentMedia.push({

      type:"image",

      src:photo

    });

  });


  if(car.video){

    currentMedia.push({

      type:"video",

      src:car.video

    });

  }


  if(!currentMedia.length){

    alert(
      "No photos available for this car yet."
    );


    return;

  }


  currentIndex = 0;


  document
    .getElementById("viewer")
    .classList
    .add("show");


  document
    .getElementById("viewerTitle")
    .textContent =
    car.title;


  renderViewer();

};


function renderViewer(){

  const image =
    document.getElementById(
      "viewerImage"
    );


  const video =
    document.getElementById(
      "viewerVideo"
    );


  const thumbs =
    document.getElementById(
      "viewerThumbs"
    );


  image
    .classList
    .add("hidden");


  video
    .classList
    .add("hidden");


  video.pause();


  video.removeAttribute(
    "src"
  );


  const media =
    currentMedia[currentIndex];


  if(media.type==="image"){

    image.src =
      media.src;


    image
      .classList
      .remove("hidden");

  }
  else{

    video.src =
      media.src;


    video
      .classList
      .remove("hidden");

  }


  thumbs.innerHTML = "";


  currentMedia.forEach(
    (item,index)=>{

      const button =
        document.createElement(
          "button"
        );


      button.className =
        "thumb"+
        (
          index===currentIndex
          ?
          " active"
          :
          ""
        );


      if(item.type==="image"){

        button.innerHTML =
          `
          <img src="${item.src}">
          `;

      }
      else{

        button.innerHTML =
          "🎥";

      }


      button.onclick =
        ()=>{

          currentIndex =
            index;


          renderViewer();

        };


      thumbs.appendChild(
        button
      );

    }
  );

}


window.previousMedia =
function(){

  if(!currentMedia.length)
    return;


  currentIndex =
    (
      currentIndex -
      1 +
      currentMedia.length
    )
    %
    currentMedia.length;


  renderViewer();

};


window.nextMedia =
function(){

  if(!currentMedia.length)
    return;


  currentIndex =
    (
      currentIndex +
      1
    )
    %
    currentMedia.length;


  renderViewer();

};


window.closeViewer =
function(){

  document
    .getElementById("viewer")

  const video =

/* =========================================================
   NORMALIZE HYDERABAD LOCATION
========================================================= */

function normalizeHyderabadPlace(place){

  let clean =
    place
      .trim()
      .replace(/\s+/g," ");


  const key =
    clean.toLowerCase();


  if(HYDERABAD_ALIASES[key]){

    clean =
      HYDERABAD_ALIASES[key];

  }


  /*
    If user has not written Hyderabad,
    automatically add Hyderabad.
  */

  const lower =
    clean.toLowerCase();


  const alreadyHasHyderabad =
    lower.includes("hyderabad") ||
    lower.includes("telangana");


  if(!alreadyHasHyderabad){

    clean =
      clean+
      ", Hyderabad, Telangana, India";

  }
  else if(
    lower.includes("hyderabad") &&
    !lower.includes("india")
  ){

    clean =
      clean+
      ", India";

  }


  return clean;

}

/* =========================================================
   FIND LOCATION
========================================================= */

async function geocodePlace(place){

  const original =
    place.trim();


  const normalized =
    normalizeHyderabadPlace(
      original
    );


  /*
    First check known Hyderabad locations.
  */

  const key =
    original
      .toLowerCase()
      .replace(/\s+/g," ")
      .trim();


  const aliasKey =
    HYDERABAD_ALIASES[key]
      ?
      HYDERABAD_ALIASES[key]
      .toLowerCase()
      :
      key;


  if(
    HYDERABAD_KNOWN_LOCATIONS[
      aliasKey
    ]
  ){

    return
      HYDERABAD_KNOWN_LOCATIONS[
        aliasKey
      ];

  }


  /*
    Nominatim search.
    Hyderabad + Telangana + India
    is automatically included.
  */

  const url =

    "https://nominatim.openstreetmap.org/search"+
    "?format=jsonv2"+
    "&limit=5"+
    "&addressdetails=1"+
    "&countrycodes=in"+
    "&accept-language=en"+
    "&q="+
    encodeURIComponent(
      normalized
    );


  const response =
    await fetch(
      url,
      {
        headers:{
          "Accept":
            "application/json"
        }
      }
    );


  if(!response.ok){

    throw new Error(
      "Location search failed."
    );

  }


  const data =
    await response.json();


  if(!data.length){

    /*
      Second attempt:
      search exact place inside Hyderabad.
    */

    const fallbackQuery =
      original+
      ", Hyderabad, Telangana, India";


    const fallbackUrl =

      "https://nominatim.openstreetmap.org/search"+
      "?format=jsonv2"+
      "&limit=5"+
      "&countrycodes=in"+
      "&q="+
      encodeURIComponent(
        fallbackQuery
      );


    const fallbackResponse =
      await fetch(
        fallbackUrl,
        {
          headers:{
            "Accept":
              "application/json"
          }
        }
      );


    if(fallbackResponse.ok){

      const fallbackData =
        await fallbackResponse.json();


      if(fallbackData.length){

        const item =
          fallbackData[0];


        return {

          lat:
            Number(item.lat),

          lon:
            Number(item.lon),

          name:
            item.display_name

        };

      }

    }


    throw new Error(
      "Location not found in Hyderabad: "+
      original
    );

  }


  /*
    Prefer Hyderabad/Telangana result.
  */

  const hyderabadResult =
    data.find(item => {

      const text =
        (
          item.display_name ||
          ""
        )
        .toLowerCase();

      return
        text.includes("hyderabad") ||
        text.includes("telangana");

    });


  const item =
    hyderabadResult ||
    data[0];


  return {

    lat:
      Number(item.lat),

    lon:
      Number(item.lon),

    name:
      item.display_name

  };

}


/* =========================================================
   CLEAR OLD ROUTE
========================================================= */

function clearRoute(){

  if(pickupMarker){

    routeMap
      .removeLayer(
        pickupMarker
      );

    pickupMarker = null;

  }


  if(destinationMarker){

    routeMap
      .removeLayer(
        destinationMarker
      );

    destinationMarker = null;

  }


  if(routeLine){

    routeMap
      .removeLayer(
        routeLine
      );

    routeLine = null;

  }

}


/* =========================================================
   SHOW ROUTE
========================================================= */

window.showRouteMap =
async function(){

  const pickup =
    document
    .getElementById("pickup")
    .value
    .trim();


  const destination =
    document
    .getElementById("destination")
    .value
    .trim();


  const status =
    document.getElementById(
      "mapStatus"
    );


  const summary =
    document.getElementById(
      "routeSummary"
    );


  if(!pickup || !destination){

    alert(
      "Please enter Pickup Point and Destination."
    );

    return;

  }


  initRouteMap();


  routeMap.invalidateSize();


  clearRoute();


  summary
    .classList
    .add("hidden");


  status.textContent =
    "🔎 Finding Hyderabad pickup and destination...";


  try{

    /*
      FIND BOTH LOCATIONS
    */

    const [
      from,
      to
    ] = await Promise.all([

      geocodePlace(
        pickup
      ),

      geocodePlace(
        destination
      )

    ]);


    /*
      PICKUP PIN
    */

    pickupMarker =
      L.marker([
        from.lat,
        from.lon
      ])
      .addTo(routeMap)
      .bindPopup(
        "📍 Pickup<br>"+
        from.name
      );


    /*
      DESTINATION PIN
    */

    destinationMarker =
      L.marker([
        to.lat,
        to.lon
      ])
      .addTo(routeMap)
      .bindPopup(
        "🏁 Destination<br>"+
        to.name
      );


    status.textContent =
      "🛣️ Calculating Hyderabad route...";


    /*
      OSRM ROUTING
    */

    const routeUrl =

      "https://router.project-osrm.org/route/v1/driving/"+
      from.lon+","+
      from.lat+";"+
      to.lon+","+
      to.lat+
      "?overview=full&geometries=geojson";


    const response =
      await fetch(
        routeUrl
      );


    if(!response.ok){

      throw new Error(
        "Route service failed."
      );

    }


    const data =
      await response.json();


    if(
      !data.routes ||
      !data.routes.length
    ){

      throw new Error(
        "Route not found."
      );

    }


    const route =
      data.routes[0];


    /*
      DRAW ROUTE
    */

    routeLine =
      L.geoJSON(
        route.geometry,
        {

          style:{

            weight:6,

            opacity:0.85

          }

        }
      )
      .addTo(routeMap);


    /*
      FIT MAP
    */

    const bounds =
      L.latLngBounds([

        [
          from.lat,
          from.lon
        ],

        [
          to.lat,
          to.lon
        ]

      ]);


    routeMap.fitBounds(
      bounds,
      {
        padding:[
          30,
          30
        ]
      }
    );


    /*
      DISTANCE
    */

    const km =
      (
        route.distance /
        1000
      )
      .toFixed(1);


    /*
      TIME
    */

    const minutes =
      Math.round(
        route.duration /
        60
      );


    const hours =
      Math.floor(
        minutes /
        60
      );


    const mins =
      minutes %
      60;


    const time =
      hours
      ?
      `${hours} hr ${mins} min`
      :
      `${mins} min`;


    document
      .getElementById(
        "routeDistance"
      )
      .textContent =
      km+" KM";


    document
      .getElementById(
        "routeDuration"
      )
      .textContent =
      time;


    summary
      .classList
      .remove("hidden");


    status.textContent =
      "✅ Hyderabad route found successfully.";

  }
  catch(error){

    console.error(error);


    status.textContent =
      "❌ "+error.message;


    alert(

      "Route नहीं बन पाया.\n\n"+
      error.message+
      "\n\nउदाहरण:\n"+
      "Nampally Metro Station\n"+
      "Miyapur\n\n"+
      "या City के साथ लिखें:\n"+
      "Nampally, Hyderabad"

    );

  }

};
