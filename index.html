<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#123d72">
<title>Car Set U - Customer</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f3f7fc;
  color:#172033;
  padding-bottom:82px;
}

button,input,select,textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

.header{
  position:sticky;
  top:0;
  z-index:4000;
  background:#123d72;
  color:white;
  padding:14px 16px;
  box-shadow:0 3px 12px #0003;
}

.header-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  font-size:25px;
  font-weight:800;
}

.logo small{
  display:block;
  font-size:12px;
  font-weight:normal;
  margin-top:2px;
  opacity:.9;
}

.header-icon{
  border:0;
  background:transparent;
  color:white;
  font-size:28px;
}

.container{
  width:min(100%,700px);
  margin:auto;
  padding:15px;
}

.card{
  background:white;
  border-radius:22px;
  padding:20px;
  margin-bottom:16px;
  box-shadow:0 5px 20px #0000000d;
}

.card h2{
  font-size:23px;
  margin-bottom:13px;
}

.card h3{
  margin:17px 0 9px;
}

.info{
  color:#596273;
  line-height:1.55;
  margin-bottom:14px;
}

.page-title{
  background:#123d72;
  color:white;
  padding:16px 18px;
  border-radius:18px;
  margin-bottom:15px;
  font-size:22px;
  font-weight:bold;
}

/* DASHBOARD */

.dashboard-option{
  background:white;
  border:1px solid #dce3ed;
  border-radius:20px;
  padding:19px;
  margin-bottom:13px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  box-shadow:0 4px 15px #00000009;
}

.dashboard-option-left{
  display:flex;
  align-items:center;
  gap:14px;
}

.dashboard-option-icon{
  font-size:34px;
}

.dashboard-option-title{
  font-size:19px;
  font-weight:800;
}

.dashboard-option-text{
  color:#687386;
  font-size:13px;
  margin-top:4px;
}

.dashboard-arrow{
  color:#1769df;
  font-size:30px;
}

/* FORM */

.form-group{
  margin-bottom:14px;
}

label{
  display:block;
  font-weight:bold;
  margin-bottom:7px;
}

input,select,textarea{
  width:100%;
  padding:14px;
  border:1px solid #d6dce5;
  border-radius:13px;
  background:white;
  outline:none;
}

textarea{
  min-height:100px;
  resize:vertical;
}

.primary{
  width:100%;
  border:0;
  background:#1769df;
  color:white;
  padding:15px;
  border-radius:13px;
  font-weight:bold;
  margin-top:8px;
}

.green{
  background:#159447;
}

.red{
  background:#df3535;
}

.gray{
  background:#687386;
}

.light-blue{
  background:#e8f1ff;
  color:#1769df;
}

/* LOGIN */

.login-help{
  background:#eef4ff;
  padding:15px;
  border-radius:14px;
  line-height:1.55;
  margin-bottom:16px;
}

.phone-row{
  display:flex;
  gap:8px;
}

.country-code{
  width:72px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#f1f4f8;
  border:1px solid #d6dce5;
  border-radius:13px;
  font-weight:bold;
}

.phone-row input{
  flex:1;
}

/* SETTINGS */

.settings-card{
  background:white;
  border-radius:20px;
  padding:0;
  overflow:hidden;
  margin-bottom:15px;
}

.settings-item{
  width:100%;
  border:0;
  background:white;
  padding:18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid #edf0f4;
  text-align:left;
}

.settings-left{
  display:flex;
  align-items:center;
  gap:12px;
  font-weight:bold;
  font-size:16px;
}

.settings-icon{
  font-size:25px;
}

.settings-arrow{
  font-size:22px;
  color:#687386;
}

/* BOOKING */

.booking-type-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.option-btn{
  border:1px solid #d9dee7;
  background:white;
  padding:14px 8px;
  border-radius:13px;
  font-weight:bold;
}

.option-btn.active{
  background:#1769df;
  color:white;
  border-color:#1769df;
}

.event-summary{
  background:#eef4ff;
  border:1px solid #d6e3f8;
  border-radius:18px;
  padding:16px;
  margin-bottom:15px;
}

.progress-bar{
  width:100%;
  height:12px;
  background:#dfe7f2;
  border-radius:20px;
  overflow:hidden;
  margin-top:10px;
}

.progress-fill{
  height:100%;
  width:0%;
  background:#1769df;
  transition:.3s;
}

.car-box{
  border:1px solid #dce4ee;
  border-radius:20px;
  padding:16px;
  margin-top:15px;
  background:white;
}

.car-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:14px;
}

.car-title{
  font-size:22px;
  font-weight:800;
}

.car-status{
  background:#eef0f3;
  color:#596273;
  border-radius:18px;
  padding:7px 10px;
  font-size:12px;
  font-weight:bold;
}

.stop-box{
  background:#f8fbff;
  border:1px solid #dce5f0;
  border-radius:16px;
  padding:15px;
  margin-top:12px;
}

.stop-number{
  display:inline-flex;
  width:31px;
  height:31px;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  background:#1769df;
  color:white;
  font-weight:bold;
  margin-right:7px;
}

.location-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:9px;
}

.location-button{
  border:0;
  background:#e8f1ff;
  color:#1769df;
  padding:12px 7px;
  border-radius:12px;
  font-weight:bold;
}

.map-box{
  height:300px;
  border-radius:17px;
  overflow:hidden;
  margin-top:13px;
  background:#e8eef7;
}

.map-status{
  background:#f7f9fc;
  padding:12px;
  border-radius:11px;
  margin-top:10px;
  color:#596273;
  font-weight:bold;
}

.route-summary{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:10px;
}

.route-item{
  background:#eef4ff;
  border-radius:13px;
  padding:12px;
  text-align:center;
}

.route-item strong{
  display:block;
  color:#1769df;
  font-size:18px;
  margin-top:5px;
}

/* VOICE */

.voice-box{
  background:#f8fbff;
  border:1px solid #dce5f0;
  border-radius:16px;
  padding:14px;
  margin-top:14px;
}

.voice-buttons{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
  margin-top:9px;
}

.voice-button{
  border:0;
  background:#e8f1ff;
  color:#1769df;
  padding:10px 5px;
  border-radius:10px;
  font-weight:bold;
  font-size:13px;
}

.voice-status{
  background:#eef4ff;
  color:#596273;
  padding:10px;
  border-radius:10px;
  margin-top:8px;
  font-size:13px;
}

/* DRIVER */

.driver-search{
  background:#eef4ff;
  border:1px solid #d6e3f8;
  border-radius:17px;
  padding:15px;
  margin-top:15px;
}

.driver-result{
  background:#e9f8ee;
  border:1px solid #b9e2c7;
  border-radius:15px;
  padding:15px;
  margin-top:12px;
}

.driver-not-found{
  background:#fff1f1;
  border:1px solid #efc1c1;
  color:#a12828;
  border-radius:15px;
  padding:15px;
  margin-top:12px;
}

.selected-driver{
  background:#e9f8ee;
  border:1px solid #b9e2c7;
  padding:14px;
  border-radius:15px;
  margin-top:12px;
}

/* BOOKINGS */

.booking-card{
  background:white;
  border:1px solid #e0e5ec;
  border-radius:17px;
  padding:15px;
  margin-top:12px;
}

.status{
  display:inline-block;
  padding:7px 11px;
  border-radius:18px;
  background:#fff5dc;
  color:#9a6200;
  font-weight:bold;
  font-size:13px;
  margin-bottom:8px;
}

.status.confirmed{
  background:#e9f8ee;
  color:#16833e;
}

.booking-row{
  padding:10px 0;
  border-bottom:1px solid #edf0f4;
  line-height:1.4;
}

.booking-row:last-child{
  border-bottom:0;
}

.booking-row strong{
  display:block;
  font-size:12px;
  color:#687386;
  margin-bottom:3px;
}

.booking-value{
  font-size:17px;
}

/* PROFILE */

.profile-row{
  padding:13px 0;
  border-bottom:1px solid #edf0f4;
}

.profile-label{
  font-size:12px;
  color:#687386;
}

.profile-value{
  font-weight:bold;
  margin-top:4px;
  word-break:break-word;
}

.notice{
  padding:13px;
  border-radius:13px;
  margin-top:10px;
  line-height:1.5;
}

.notice.blue{
  background:#eef4ff;
  color:#344054;
}

.notice.green{
  background:#e9f8ee;
  color:#18763b;
}

.notice.red{
  background:#fff0f0;
  color:#a12828;
}

/* BOTTOM */

.bottom-nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  height:72px;
  background:white;
  border-top:1px solid #dce0e5;
  display:grid;
  grid-template-columns:repeat(2,1fr);
  z-index:5000;
  box-shadow:0 -3px 15px #0000000d;
}

.bottom-nav button{
  border:0;
  background:white;
  color:#596273;
  font-size:12px;
  font-weight:bold;
}

.bottom-nav button.active{
  color:#1769df;
}

.bottom-nav span{
  display:block;
  font-size:24px;
  margin-bottom:2px;
}

@media(max-width:480px){

.container{
  padding:11px;
}

.card{
  padding:16px;
  border-radius:18px;
}

.page-title{
  font-size:20px;
}

.dashboard-option{
  padding:15px;
}

.voice-button{
  font-size:12px;
}

}
</style>
</head>

<body>

<header class="header">

<div class="header-row">

<div class="logo">
🚕 Car Set U
<small>Customer Panel</small>
</div>

<button class="header-icon"
onclick="openScreen('profile')">
👤
</button>

</div>

</header>


<main class="container">

<!-- LOGIN -->

<section id="loginScreen">

<div class="card">

<h2>📱 Customer Login</h2>

<div class="login-help">

पहले अपना <b>Mobile Number</b> डालें।

<br><br>

Demo version में Login के बाद Customer Panel खुलेगा।

<br><br>

बाद में यही Login Firebase Google/Gmail से connect किया जाएगा।

</div>

<div class="form-group">

<label>Mobile Number</label>

<div class="phone-row">

<div class="country-code">
+91
</div>

<input
id="phoneNumber"
type="tel"
inputmode="numeric"
maxlength="10"
placeholder="10 digit mobile number">

</div>

</div>

<button
class="primary"
onclick="continueLogin()">

Continue

</button>

</div>

</section>


<!-- MAIN -->

<div id="mainApp" class="hidden">


<!-- DASHBOARD -->

<section id="dashboardScreen">

<div class="page-title">
📅 Booking Dashboard
</div>


<button
class="dashboard-option"
onclick="openSettings('booking')">

<div class="dashboard-option-left">

<div class="dashboard-option-icon">
🚕
</div>

<div>

<div class="dashboard-option-title">
New Cab Booking
</div>

<div class="dashboard-option-text">
New cab या Event booking करें
</div>

</div>

</div>

<div class="dashboard-arrow">
›
</div>

</button>


<button
class="dashboard-option"
onclick="openSettings('driver')">

<div class="dashboard-option-left">

<div class="dashboard-option-icon">
🆔
</div>

<div>

<div class="dashboard-option-title">
Search Driver
</div>

<div class="dashboard-option-text">
Driver ID से Driver search करें
</div>

</div>

</div>

<div class="dashboard-arrow">
›
</div>

</button>

</section>


<!-- PROFILE -->

<section id="profileScreen" class="hidden">

<div class="page-title">
👤 My Profile
</div>

<div class="card">

<h2>Account Information</h2>

<div class="profile-row">
<div class="profile-label">NAME</div>
<div id="profileName" class="profile-value">
Customer
</div>
</div>

<div class="profile-row">
<div class="profile-label">MOBILE</div>
<div id="profilePhone" class="profile-value">
-
</div>
</div>

</div>


<div class="card">

<h2>⚙️ Settings</h2>

<div class="settings-card">

<button
class="settings-item"
onclick="openSettings('booking')">

<div class="settings-left">
<span class="settings-icon">🚕</span>
<span>New Cab Booking</span>
</div>

<span class="settings-arrow">›</span>

</button>


<button
class="settings-item"
onclick="openSettings('bookings')">

<div class="settings-left">
<span class="settings-icon">📋</span>
<span>My Bookings</span>
</div>

<span class="settings-arrow">›</span>

</button>


<button
class="settings-item"
onclick="openSettings('driver')">

<div class="settings-left">
<span class="settings-icon">🆔</span>
<span>Search Driver</span>
</div>

<span class="settings-arrow">›</span>

</button>


<button
class="settings-item"
onclick="openSettings('tracking')">

<div class="settings-left">
<span class="settings-icon">📍</span>
<span>Live Driver Tracking</span>
</div>

<span class="settings-arrow">›</span>

</button>

</div>


<button
class="primary red"
onclick="logoutUser()">

Logout

</button>

</div>

</section>


<!-- SETTINGS -->

<section
id="settingsScreen"
class="hidden">

<div id="settingsContent"></div>

</section>

</div>

</main>


<!-- BOTTOM -->

<nav class="bottom-nav">

<button
id="navDashboard"
class="active"
onclick="openScreen('dashboard')">

<span>📅</span>
Dashboard

</button>

<button
id="navProfile"
onclick="openScreen('profile')">

<span>👤</span>
Profile

</button>

</nav>


<script
src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<script>

/* =====================================================
   CAR SET U CUSTOMER FINAL DEMO VERSION
   Firebase बाद में जोड़ा जाएगा।
   ===================================================== */


/* STATE */

let selectedRental="Local";
let selectedVehicle="Sedan";

let currentEvent=null;
let currentCarNumber=1;

let routeMap=null;
let routeLine=null;
let routeMarkers=[];

let mediaRecorder=null;
let voiceChunks=[];
let voiceBlob=null;
let voiceUrl=null;

let currentRouteDistance="—";
let currentRouteDuration="—";


/* LOGIN */

function continueLogin(){

const phone=
document.getElementById("phoneNumber")
.value
.replace(/\D/g,"");

if(phone.length!==10){

alert("कृपया सही 10 digit Mobile Number डालें।");
return;

}

localStorage.setItem(
"carSetU_phone",
"+91"+phone
);

document.getElementById("loginScreen")
.classList.add("hidden");

document.getElementById("mainApp")
.classList.remove("hidden");

document.getElementById("profilePhone")
.textContent="+91"+phone;

openScreen("dashboard");

}


function logoutUser(){

localStorage.removeItem("carSetU_phone");

document.getElementById("mainApp")
.classList.add("hidden");

document.getElementById("loginScreen")
.classList.remove("hidden");

openScreenWithoutAuth("dashboard");

}


/* SCREEN */

function openScreenWithoutAuth(screen){

document.getElementById("dashboardScreen")
.classList.add("hidden");

document.getElementById("profileScreen")
.classList.add("hidden");

document.getElementById("settingsScreen")
.classList.add("hidden");

document.getElementById("navDashboard")
.classList.remove("active");

document.getElementById("navProfile")
.classList.remove("active");

if(screen==="dashboard"){

document.getElementById("dashboardScreen")
.classList.remove("hidden");

document.getElementById("navDashboard")
.classList.add("active");

}

if(screen==="profile"){

document.getElementById("profileScreen")
.classList.remove("hidden");

document.getElementById("navProfile")
.classList.add("active");

}

window.scrollTo(0,0);

}


function openScreen(screen){

if(!localStorage.getItem("carSetU_phone")){

alert("पहले Mobile Number डालें।");
return;

}

openScreenWithoutAuth(screen);

}


/* SETTINGS */

function openSettings(type){

document.getElementById("dashboardScreen")
.classList.add("hidden");

document.getElementById("profileScreen")
.classList.add("hidden");

document.getElementById("settingsScreen")
.classList.remove("hidden");

document.getElementById("navDashboard")
.classList.remove("active");

document.getElementById("navProfile")
.classList.add("active");

const box=
document.getElementById("settingsContent");

if(type==="booking")
renderNewBooking(box);

if(type==="bookings")
renderMyBookings(box);

if(type==="driver")
renderDriverSearch(box);

if(type==="tracking")
renderTracking(box);

window.scrollTo(0,0);

}


/* SETTINGS HEADER */

function settingsHeader(title){

return `
<div class="page-title">
⚙️ Settings
</div>

<div class="card">
<h2>${title}</h2>
</div>
`;

}


/* =====================================================
   NEW CAB BOOKING
   ===================================================== */

function renderNewBooking(box){

box.innerHTML=
settingsHeader("🚕 New Cab Booking")+

`
<div class="card">

<div class="booking-type-grid">

<button
class="option-btn active"
onclick="startNormalBooking()">

🚕 Single Cab

</button>

<button
class="option-btn"
onclick="startEventBooking()">

🎉 Event Booking

</button>

</div>

<div id="bookingModeArea">

<div class="notice blue">

Booking Type select करें।

</div>

</div>

</div>
`;

}


function startNormalBooking(){

document.getElementById("bookingModeArea").innerHTML=`

<div class="event-summary">

<h3>🚕 Single Cab Booking</h3>

<p class="info">
एक Customer के लिए एक Cab booking करें।
</p>

</div>

<div class="form-group">
<label>📅 Pickup Date</label>
<input id="singleDate" type="date">
</div>

<div class="form-group">
<label>⏰ Pickup Time</label>
<input id="singleTime" type="time">
</div>

<div class="form-group">
<label>⏰ Drop Time</label>
<input id="singleDropTime" type="time">
</div>

<div class="form-group">
<label>📍 Pickup Location</label>
<input id="singlePickup"
placeholder="Enter Pickup Location">

<div class="location-buttons">

<button class="location-button"
onclick="useCurrentLocation('singlePickup')">

📍 Current Location

</button>

<button class="location-button"
onclick="pasteLocation('singlePickup')">

📋 Paste Location

</button>

</div>

</div>

<div class="form-group">
<label>🏁 Drop Location</label>
<input id="singleDrop"
placeholder="Enter Drop Location">
</div>

<button
class="primary"
onclick="alert('Single Cab UI तैयार है। Firebase connection अगले चरण में जोड़ा जाएगा।')">

🚕 Place Booking

</button>

`;

setDefaultSingleDate();

}


function startEventBooking(){

currentEvent=null;
currentCarNumber=1;

document.getElementById("bookingModeArea").innerHTML=`

<div class="event-summary">

<h3>🎉 Event Booking</h3>

<p class="info">

एक Event के लिए जितनी गाड़ियाँ चाहिए उतनी संख्या डालें।
हर Car बाद में अलग-अलग Pickup और Time के साथ book होगी।

</p>

<div class="form-group">

<label>Event Name (Optional)</label>

<input
id="eventName"
placeholder="Wedding / Function / Corporate">

</div>

<div class="form-group">

<label>Total Cars Required</label>

<input
id="totalCars"
type="number"
min="1"
max="1000"
value="1"
oninput="updateCarCountPreview()">

</div>

<div id="carCountPreview"
style="font-size:18px;font-weight:bold;color:#1769df">

🚕 1 Car

</div>

</div>

<button
class="primary"
onclick="createEvent()">

🎉 Start Event Booking

</button>

<div id="eventBookingArea"></div>

`;

}


/* EVENT CREATE */

function updateCarCountPreview(){

const value=
Math.max(
1,
Number(document.getElementById("totalCars").value||1)
);

document.getElementById("carCountPreview")
.textContent=
"🚕 "+value+" Car"+(value===1?"":"s");

}


function createEvent(){

const eventName=
document.getElementById("eventName")
.value.trim();

const total=
Number(
document.getElementById("totalCars")
.value
);

if(!total || total<1){

alert("Total Cars Required सही डालें।");
return;

}

const eventId=
"EVENT_"+Date.now()+"_"+Math.random()
.toString(36)

function today(){

const d=new Date();

return d.getFullYear()+
"-"+
String(d.getMonth()+1).padStart(2,"0")+
"-"+
String(d.getDate()).padStart(2,"0");

}


function timeNow(){

const d=new Date();

return String(d.getHours()).padStart(2,"0")+
":"+
String(d.getMinutes()).padStart(2,"0");

}


function setDefaultEventDateTime(){

const date=
document.getElementById("eventPickupDate");

document.getElementById("eventPickupTime");

document.getElementById("eventDropTime");

}

function useCurrentLocation(inputId){

if(!navigator.geolocation){

alert("इस phone में Location उपलब्ध नहीं है।");
return;

}

navigator.geolocation.getCurrentPosition(

position=>{

const lat=
position.coords.latitude;

const lon=
position.coords.longitude;

document.getElementById(inputId)
.value=
lat.toFixed(6)+", "+lon.toFixed(6);

},

error=>{

alert(
"Current Location नहीं मिली।\n\n"+
"Location permission ON करें।"
);

},

{
enableHighAccuracy:true,
timeout:10000
}

);

}

const text=
await navigator.clipboard.readText();

if(!text){

alert("Clipboard खाली है।");
return;

}

.value=text;

}catch(error){

"Location manually paste करें।"
);

}

const LOCATIONS={

"uppal":[17.4010,78.5591],
"koti":[17.3840,78.4867],
"lb nagar":[17.3457,78.5522],
"nampally":[17.3930,78.4668],
"ameerpet":[17.4375,78.4483],
"kukatpally":[17.4849,78.4138],
"miyapur":[17.4969,78.3498],
"airport shamshabad":[17.2403,78.4294],
"shamshabad":[17.2510,78.4294],
"madhapur":[17.4483,78.3915],
"gachibowli":[17.4401,78.3489],
"hitech city":[17.4435,78.3772],
"secunderabad":[17.4399,78.4983],
"banjara hills":[17.4156,78.4347],
"jubilee hills":[17.4325,78.4071]

};


async function geocode(place){

const clean=
place.trim().toLowerCase();

if(LOCATIONS[clean]){

return {
lat:LOCATIONS[clean][0],
lon:LOCATIONS[clean][1],
name:place
};

}

const match=
Object.keys(LOCATIONS)
.find(k=>clean.includes(k));

if(match){

return {
lat:LOCATIONS[match][0],
lon:LOCATIONS[match][1],
name:place
};

}


/* coordinates directly */

const coordinateMatch=
place.match(
/(-?\d+(?:\.\d+)?)\s*[, ]\s*(-?\d+(?:\.\d+)?)/);

if(coordinateMatch){

return {
lat:Number(coordinateMatch[1]),
lon:Number(coordinateMatch[2]),
name:place
};

}


let query=place;

if(!clean.includes("hyderabad")){

query += ", Hyderabad, Telangana, India";

}

const url=
"https://nominatim.openstreetmap.org/search"+
"?format=jsonv2&limit=1&q="+
encodeURIComponent(query);

const response=
await fetch(url);

if(!response.ok){

throw new Error("Location search failed.");

}

const data=
await response.json();

if(!data.length){

throw new Error(
"Location नहीं मिली: "+place
);

}

return {
lat:Number(data[0].lat),
lon:Number(data[0].lon),
name:data[0].display_name
};

}


async function routeBetween(points){

const coords=
points
.map(p=>p.lon+","+p.lat)
.join(";");

const url=
"https://router.project-osrm.org/route/v1/driving/"+
coords+
"?overview=full&geometries=geojson";

const response=
await fetch(url);

if(!response.ok){

throw new Error("Route service failed.");

}

const data=
await response.json();

if(!data.routes || !data.routes.length){

throw new Error("Route नहीं मिला।");

}

return data.routes[0];

}


function initEventMap(){

if(routeMap){

setTimeout(
()=>routeMap.invalidateSize(),
200
);

return;

}

routeMap=
L.map("eventRouteMap")
.setView([17.3850,78.4867],11);

L.tileLayer(
"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
{
maxZoom:19,
attribution:"© OpenStreetMap contributors"
}
).addTo(routeMap);

}


async function showEventRoute(){

const pickup=
document.getElementById("eventPickup")
.value.trim();

const drop=
document.getElementById("eventDrop")
.value.trim();

const status=
document.getElementById("eventMapStatus");

if(!pickup || !drop){

alert(
"पहले Pickup और Drop Location डालें।"
);

return;

}

initEventMap();

status.textContent=
"🔎 Location search हो रही है...";

try{

const points=
await Promise.all([
geocode(pickup),
geocode(drop)
]);

status.textContent=
"🛣️ Route calculate हो रहा है...";

routeMarkers.forEach(
m=>routeMap.removeLayer(m)
);

routeMarkers=[];

if(routeLine){

routeMap.removeLayer(routeLine);
routeLine=null;

}

const route=
await routeBetween(points);

points.forEach((point,index)=>{

const marker=
L.marker([
point.lat,
point.lon
])
.addTo(routeMap)
.bindPopup(
index===0
?"📍 Pickup<br>"+escapeHtml(point.name)
:"🏁 Drop<br>"+escapeHtml(point.name)
);

routeMarkers.push(marker);

});


routeLine=
L.geoJSON(
route.geometry,
{
style:{
weight:6,
opacity:.85
}
}
).addTo(routeMap);


routeMap.fitBounds(
routeLine.getBounds(),
{
padding:[25,25]
}
);


currentRouteDistance=
(route.distance/1000)
.toFixed(1)+" KM";


const minutes=
Math.round(route.duration/60);

const hours=
Math.floor(minutes/60);

const mins=
minutes%60;

currentRouteDuration=
hours>0
?hours+" hr "+mins+" min"
:mins+" min";


document.getElementById("eventDistance")
.textContent=
currentRouteDistance;

document.getElementById("eventDuration")
.textContent=
currentRouteDuration;

document.getElementById("eventRouteSummary")
.classList.remove("hidden");

status.textContent=
"✅ Complete Route Found.";

}catch(error){

console.error(error);

status.textContent=
"❌ "+error.message;

alert(
"Route नहीं बन पाया.\n\n"+
error.message
);

}

}

   ===================================================== */

async function startVoiceRecording(){

if(!navigator.mediaDevices ||
!navigator.mediaDevices.getUserMedia){

alert(
"इस browser में Voice Recording उपलब्ध नहीं है।"
);

return;

}

try{

const stream=
await navigator.mediaDevices.getUserMedia({
audio:true
});

voiceChunks=[];

mediaRecorder=
new MediaRecorder(stream);

mediaRecorder.ondataavailable=
event=>{

if(event.data.size>0){

voiceChunks.push(event.data);

}

};

mediaRecorder.onstop=()=>{

voiceBlob=
new Blob(
voiceChunks,
{
type:"audio/webm"
}
);

if(voiceUrl){

URL.revokeObjectURL(voiceUrl);

}

voiceUrl=
URL.createObjectURL(voiceBlob);

document.getElementById("voiceStatus")
.textContent=
"✅ Voice Note Recorded. Play दबाकर सुनें।";

stream.getTracks()
.forEach(track=>track.stop());

};

mediaRecorder.start();

document.getElementById("voiceStatus")
.textContent=
"🔴 Recording चालू है...";

}catch(error){

alert(
"Microphone permission नहीं मिली।"
);

}

}


function stopVoiceRecording(){

if(
mediaRecorder &&
mediaRecorder.state!=="inactive"
){

mediaRecorder.stop();

}

}


function playVoiceRecording(){

if(!voiceUrl){

alert("पहले Voice Note Record करें।");
return;

}

const audio=
new Audio(voiceUrl);

audio.play();

document.getElementById("voiceStatus")
.textContent=
"▶️ Voice Note Playing...";

}

function randomCode(){

}


function escapeHtml(value){

return String(value??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}
