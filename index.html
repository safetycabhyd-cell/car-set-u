<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<meta name="theme-color" content="#123d72">

<title>Car Set U - Customer</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:Arial,sans-serif;
background:#f3f7fc;
color:#172033;
padding-bottom:75px;
}

button,input{
font:inherit;
}

button{
cursor:pointer;
}

.hidden{
display:none!important;
}


.header{
background:#123d72;
color:white;
padding:15px;
position:sticky;
top:0;
z-index:10;
}


.logo{
font-size:24px;
font-weight:bold;
}


.logo small{
display:block;
font-size:12px;
}


.container{
max-width:700px;
margin:auto;
padding:15px;
}


.card{
background:white;
padding:18px;
border-radius:20px;
margin-bottom:15px;
box-shadow:0 5px 15px #0002;
}


h2{
margin-bottom:15px;
}


input{

width:100%;
padding:14px;
border-radius:12px;
border:1px solid #ddd;
margin-bottom:12px;

}


.primary{

width:100%;
padding:14px;
border:0;
border-radius:12px;
background:#1769df;
color:white;
font-weight:bold;

}


.green{
background:#159447;
}


.red{
background:#df3535;
}


.page-title{

background:#123d72;
color:white;
padding:15px;
border-radius:15px;
font-size:20px;
margin-bottom:15px;

}


.map{

height:300px;
border-radius:15px;
overflow:hidden;

}


.bottom{

position:fixed;
bottom:0;
left:0;
right:0;
height:65px;
background:white;
display:flex;
justify-content:space-around;
border-top:1px solid #ddd;

}


.bottom button{

border:0;
background:white;

}


</style>

</head>


<body>


<header class="header">

<div class="logo">
🚕 Car Set U
<small>Customer Panel</small>
</div>

</header>



<div class="container">


<section id="login">


<div class="card">

<h2>
📱 Customer Login
</h2>


<input id="phone"
placeholder="10 digit mobile number">


<button class="primary"
onclick="savePhone()">

Continue

</button>


<div id="googleBox" class="hidden">

<br>

<button class="primary"
onclick="googleLogin()">

Google Login

</button>

</div>


</div>


</section>





<div id="app" class="hidden">



<section id="booking">


<div class="page-title">
🚕 Book Cab
</div>



<div class="card">


<input id="pickup"
placeholder="Pickup Location">


<input id="destination"
placeholder="Destination">



<button class="primary"
onclick="showMap()">

📍 Show Route

</button>


<div id="map"
class="map">

</div>


<br>


<input id="driver"
placeholder="Driver ID DC001">


<button class="primary"
onclick="findDriver()">

Search Driver

</button>


<div id="driverResult"></div>



<button class="primary green"
onclick="bookCab()">

Confirm Booking

</button>


</div>


</section>




<section id="profile" class="hidden">


<div class="page-title">
👤 Profile
</div>


<div class="card">

<p id="userInfo">
Customer
</p>


<button class="primary red"
onclick="logout()">

Logout

</button>


</div>


</section>



</div>


</div>





<div class="bottom">


<button onclick="openPage('booking')">
🚕<br>
Booking
</button>


<button onclick="openPage('profile')">
👤<br>
Profile
</button>


</div>




<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


<script>

let driver=null;

let map;


function savePhone(){

let p=document.getElementById("phone").value;


if(p.length!=10){

alert("Enter valid mobile");

return;

}


localStorage.setItem("phone",p);


document.getElementById("googleBox")
.classList.remove("hidden");


}



function googleLogin(){

document.getElementById("login")
.classList.add("hidden");


document.getElementById("app")
.classList.remove("hidden");


}



function openPage(page){

document.querySelectorAll("#app section")
.forEach(x=>x.classList.add("hidden"));


document.getElementById(page)
.classList.remove("hidden");

}



function showMap(){


if(!map){

map=L.map('map')
.setView([17.385,78.486],12);


L.tileLayer(
'https://tile.openstreetmap.org/{z}/{x}/{y}.png'
).addTo(map);

}


}



function findDriver(){

let id=
document.getElementById("driver").value;


if(!id.startsWith("DC")){

alert("Driver ID सही डालें");

return;

}


driver=id;


document.getElementById("driverResult")
.innerHTML=
"✅ Driver Selected : "+id;


}



function bookCab(){


if(!driver){

alert("Select Driver");

return;

}


alert("✅ Booking Sent Successfully");


}



function logout(){

location.reload();

}


</script>


</body>
</html>
