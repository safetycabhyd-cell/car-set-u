/* =====================================================
PHONE
===================================================== */

function normalizePhone(value){

const digits=
(value||"").replace(/\D/g,"");

if(digits.length===10)
return "+91"+digits;

if(
digits.length===12 &&
digits.startsWith("91")
)
return "+"+digits;

return "";

}


function getCustomerPhone(){

return normalizePhone(
localStorage.getItem("carSetU_phone")||""
);

}


/* =====================================================
CUSTOMER KEY
===================================================== */

function getCustomerKey(){

const user=auth.currentUser;

const phone=
getCustomerPhone();

if(!user)
return "";

if(!phone)
return user.uid;

return user.uid+"_"+phone.replace(/\D/g,"");

}


/*
  IMPORTANT:

  हर customer + phone combination का
  अलग booking counter रहेगा।
*/

function getCounterDocumentId(){

return getCustomerKey();

}


/* =====================================================
CUSTOMER BOOKING ID
===================================================== */

async function createCustomerBookingId(){

if(!auth.currentUser)
throw new Error("Customer login required.");

const counterId=
getCounterDocumentId();

if(!counterId)
throw new Error("Customer identification missing.");

const counterRef=
doc(
db,
"customerBookingCounters",
counterId
);

const bookingNumber=
await runTransaction(
db,
async transaction=>{

const counterSnap=
await transaction.get(counterRef);

let nextNumber=1;

if(counterSnap.exists()){

const oldNumber=
Number(
counterSnap.data().lastNumber||0
);

nextNumber=
oldNumber+1;

}

transaction.set(
counterRef,
{
customerUid:
auth.currentUser.uid,

customerPhone:
getCustomerPhone(),

lastNumber:
nextNumber,

updatedAt:
serverTimestamp()
},
{
merge:true
}
);

return nextNumber;

}
);

return "BC"+
String(bookingNumber)
.padStart(3,"0");

}

/* =====================================================
GEOCODE
===================================================== */

async function geocodePlace(place){

const clean=
place.trim().toLowerCase();

const gpsMatch=
place.match(
/Current Location\s*\(([-\d.]+),\s*([-\d.]+)\)/i
);

if(gpsMatch){

return{

lat:Number(gpsMatch[1]),

lon:Number(gpsMatch[2]),

name:"Current Location"

};

}

const match=
Object.keys(knownLocations)
.find(
k=>clean.includes(k)
);

if(match){

return{

lat:knownLocations[match][0],

lon:knownLocations[match][1],

name:place

};

}

let q=
place.trim();

if(
!q.toLowerCase()
.includes("india")
){

q+=", Telangana, India";

}

const url=
"https://nominatim.openstreetmap.org/search"+
"?format=jsonv2"+
"&limit=1"+
"&countrycodes=in"+
"&q="+
encodeURIComponent(q);

const response=
await fetch(url);

if(!response.ok)
throw new Error(
"Location search failed."
);

const data=
await response.json();

if(!data.length)
throw new Error(
"Location not found: "+place
);

return{

lat:Number(data[0].lat),

lon:Number(data[0].lon),

name:data[0].display_name

};

}


/* =====================================================
ROUTE
===================================================== */

async function getRoute(points){

const coords=
points
.map(
p=>p.lon+","+p.lat
)
.join(";");

const url=
"https://router.project-osrm.org/route/v1/driving/"+
coords+
"?overview=full&geometries=geojson";

const response=
await fetch(url);

if(!response.ok)
throw new Error(
"Route service failed."
);

const data=
await response.json();

if(
!data.routes||
!data.routes.length
)
throw new Error(
"Route not found."
);

return data.routes[0];

}


/* =====================================================
SINGLE ROUTE
===================================================== */

window.showSingleRoute=
async function(){

const pickup=
document.getElementById(
"singlePickup"
).value.trim();

const drop=
document.getElementById(
"singleDrop"
).value.trim();

if(!pickup||!drop){

alert(
"Please enter Pickup and Final Destination."
);

return;

}

const map=
initMapFor("singleRouteMap");

const status=
document.getElementById(
"singleMapStatus"
);

status.textContent=
"🔎 Finding locations...";

try{

const points=
await Promise.all([
geocodePlace(pickup),
geocodePlace(drop)
]);

status.textContent=
"🛣️ Calculating route...";

if(routeLine)
map.removeLayer(routeLine);

routeMarkers.forEach(
m=>map.removeLayer(m)
);

routeMarkers=[];

const route=
await getRoute(points);

points.forEach(
(point,index)=>{

const marker=
L.marker(
[
point.lat,
point.lon
]
)
.addTo(map)
.bindPopup(
index===0
?
"📍 Pickup<br>"+
escapeHtml(point.name)
:
"🏁 Destination<br>"+
escapeHtml(point.name)
);

routeMarkers.push(marker);

}
);

routeLine=
L.geoJSON(
route.geometry,
{
style:{
weight:6,
opacity:.85
}
}
)
.addTo(map);

map.fitBounds(
routeLine.getBounds(),
{
padding:[25,25]
}
);

const km=
(route.distance/1000)
.toFixed(1);

const minutes=
Math.round(
route.duration/60
);

const hours=
Math.floor(minutes/60);

const mins=
minutes%60;

const time=
hours>0
?
hours+" hr "+mins+" min"
:
mins+" min";

document.getElementById(
"singleDistance"
).textContent=
km+" KM";

document.getElementById(
"singleDuration"
).textContent=
time;

document.getElementById(
"singleRouteSummary"
).classList.remove("hidden");

status.textContent=
"✅ Complete route found.";

}catch(error){

console.error(error);

status.textContent=
"❌ "+error.message;

alert(
"Route नहीं बन पाया.\n\n"+
error.message
);

}

};

function normalizeDriverId(value){

let id=
(value||"")
.trim()
.toUpperCase()
.replace(/\s+/g,"");

if(
/^DRIVER\d+$/.test(id)
){

id=
"DC"+
id.replace(
"DRIVER",
""
);

}

return id;

}

window.searchDriver=
async function(mode){

:
"eventDriverId"
);

const result=
document.getElementById(
mode==="single"
?
"singleDriverResult"
:

);

const value=
normalizeDriverId(
input.value
);

input.value=value;

if(!/^DC\d+$/.test(value)){

result.innerHTML=
`
<div class="driver-not-found">

❌ Invalid Driver ID

<br>

Example: DC001

</div>
`;

return;

}

result.innerHTML=
`
<div class="driver-result">

🔎 Searching Driver...

</div>
`;

try{

const q=
query(
collection(db,"cabDrivers"),
where(
"driverId",
"==",
value
),
limit(1)
);

const snap=
await getDocs(q);

if(snap.empty){

result.innerHTML=
`
<div class="driver-not-found">

❌ Driver ${escapeHtml(value)}
not found.

</div>
`;

return;

}

const d=
snap.docs[0];

const data=
d.data();

if(
data.blacklisted===true||
data.status==="blacklisted"
){

result.innerHTML=
`
<div class="driver-not-found">

🚫 Driver Unavailable

</div>
`;

return;

}

selectedDriver={

documentId:d.id,

driverId:value,

uid:
data.uid||
data.userId||
data.authUid||
null,

name:
data.name||
data.driverName||
"Driver",

mobile:
data.mobile||
data.phone||
"",

vehicle:
data.vehicleNumber||
data.vehicle||
data.car||
"-",

vehicleType:
data.vehicleType||
data.type||
"Cab",

photo:
data.photoURL||
data.photoUrl||
data.photo||
data.profilePhoto||
"",

online:
data.online===true||
data.dutyStatus==="ON"||
data.dutyOn===true

};

let photoHtml="";

if(selectedDriver.photo){

photoHtml=
`
<img
class="driver-photo"
src="${escapeHtml(
selectedDriver.photo
)}"
alt="Driver Photo">
`;

}

result.innerHTML=
`

/* =====================================================
VOICE RECORD
===================================================== */

window.startVoice=function(prefix){

if(
!navigator.mediaDevices||
!navigator.mediaDevices.getUserMedia
){

alert(
"Voice recording is not supported."
);

return;

}

navigator.mediaDevices
.getUserMedia({
audio:true
})
.then(
stream=>{

voiceChunks=[];

recorder=
new MediaRecorder(stream);

recorder.ondataavailable=
e=>{

if(e.data.size>0)
voiceChunks.push(e.data);

};

recorder.onstop=
()=>{

voiceBlob=
new Blob(
voiceChunks,
{
type:"audio/webm"
}
);

const player=
document.getElementById(
prefix+"VoicePlayer"
);

if(player){

player.src=
URL.createObjectURL(
voiceBlob
);

player.classList.remove(
"hidden"
);

}

const status=
document.getElementById(
prefix+"VoiceStatus"
);

if(status)
status.textContent=
"✅ Voice recorded.";

stream
.getTracks()
.forEach(
t=>t.stop()
);

};

recorder.start();

const status=
document.getElementById(
prefix+"VoiceStatus"
);

if(status)
status.textContent=
"🔴 Recording...";

}
)
.catch(
error=>{

console.error(error);

alert(
"Microphone permission required."
);

}
);

};


window.stopVoice=function(){

if(
recorder&&
recorder.state!=="inactive"
){

recorder.stop();

}

};


window.playVoice=function(){

const players=[
"singleVoicePlayer",
"eventVoicePlayer"
];

for(
const id
of players
){

const p=
document.getElementById(id);

if(
p&&
!p.classList.contains("hidden")
){

p.play();

return;

}

}

alert(
"No voice recording available."
);

};

window.showEventRoute=

"eventDrop"

"Please enter Pickup and Destination."
);

const map=
initMapFor("eventRouteMap");

const status=
document.getElementById(
"eventMapStatus"
);

status.textContent=
"🔎 Finding locations...";

try{

const points=
await Promise.all([
geocodePlace(pickup),
geocodePlace(drop)
]);

status.textContent=
"🛣️ Calculating route...";

const route=
await getRoute(points);

const line=
L.geoJSON(
route.geometry,
{
style:{
weight:6,
opacity:.85
}
}
)
.addTo(map);

map.fitBounds(
line.getBounds(),
{
padding:[25,25]
}
);

const km=
(route.distance/1000)
.toFixed(1);

const mins=
Math.round(
route.duration/60
);

document.getElementById(
"eventDistance"
).textContent=
km+" KM";

document.getElementById(
"eventDuration"
).textContent=
mins+" min";

document.getElementById(
"eventRouteSummary"
).classList.remove("hidden");

status.textContent=
"✅ Complete route found.";

}catch(error){

status.textContent=
"❌ "+error.message;

alert(
error.message
);

}

};

today.split("-");

/* =====================================================
LIVE DRIVERS
===================================================== */

async function loadLiveDrivers(map){

if(!auth.currentUser)
return;

try{

const bookings=[];


/*
  Only this customer's bookings.
*/

for(
const collectionName
of [
"cabBookings",
"eventBookings"
]
){

const q=
query(
collection(db,collectionName),
where(
"customerUid",
"==",
auth.currentUser.uid
)
);

const snap=
await getDocs(q);


snap.forEach(
d=>{

const b=d.data();

if(
b.status==="accepted"||
b.status==="running"||
b.status==="started"
){

bookings.push({

...b,

id:d.id

});

}

});

}


let live=0;


for(
const booking
of bookings
){

if(!booking.driverId)
continue;


try{

const response=
await fetch(

"https://car-set-u-default-rtdb.asia-southeast1.firebasedatabase.app/drivers/"+
encodeURIComponent(
booking.driverId
)+
".json"

);


if(!response.ok)
continue;


const data=
await response.json();


const loc=
data?.location;


if(
loc&&
typeof loc.latitude==="number"&&
typeof loc.longitude==="number"
){

live++;


L.marker(
[
loc.latitude,
loc.longitude
]
)
.addTo(map)
.bindPopup(

"<b>🚕 "+
escapeHtml(
booking.driverId
)+
"</b><br>"+
escapeHtml(
booking.driverName||
"Driver"
)+
"<br><br>"+
"📍 "+
escapeHtml(
booking.pickup||"-"
)+
"<br>"+
"🏁 "+
escapeHtml(
booking.destination||"-"
)

);

}

}catch(error){

console.error(error);

}

}


document.getElementById(
"liveCount"
).textContent=
live+
" Driver"+
(live===1?"":"s")+
" Live";


}catch(error){

console.error(error);

}

}

/* =====================================================
ESCAPE
===================================================== */

function escapeHtml(value){

return String(
value??""
)
.replace(
/&/g,
"&amp;"
)
.replace(
/</g,
"&lt;"
)
.replace(
/>/g,
"&gt;"
)
.replace(
/"/g,
"&quot;"
)
.replace(
/'/g,
"&#039;"
);

}
